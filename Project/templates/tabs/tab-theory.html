<div class="theory-lab-container">
    <style>
        .theory-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 160px);
            min-height: 500px;
        }

        .theory-sidebar {
            width: 250px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        .theory-sidebar-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 6px 12px;
            letter-spacing: 1px;
        }

        .theory-menu-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-color);
            padding: 10px 14px;
            text-align: left;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theory-menu-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
        }

        /* Active states for sidebar menu based on pillars */
        .theory-menu-btn.active[data-part="1"] { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.3); color: #38bdf8; }
        .theory-menu-btn.active[data-part="2"] { background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.3); color: #4ade80; }
        .theory-menu-btn.active[data-part="3"] { background: rgba(192, 132, 252, 0.1); border-color: rgba(192, 132, 252, 0.3); color: #c084fc; }
        .theory-menu-btn.active[data-part="4"] { background: rgba(251, 146, 60, 0.1); border-color: rgba(251, 146, 60, 0.3); color: #fb923c; }
        .theory-menu-btn.active[data-part="5"] { background: rgba(250, 204, 21, 0.1); border-color: rgba(250, 204, 21, 0.3); color: #facc15; }
        .theory-menu-btn.active[data-part="6"] { background: rgba(45, 212, 191, 0.1); border-color: rgba(45, 212, 191, 0.3); color: #2dd4bf; }
        .theory-menu-btn.active[data-part="7"] { background: rgba(244, 114, 182, 0.1); border-color: rgba(244, 114, 182, 0.3); color: #f472b6; }

        .theory-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 0;
        }

        .theory-header-block {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theory-part-title {
            font-size: 18px;
            font-weight: 700;
        }

        .theory-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .theory-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .theory-card::-webkit-scrollbar {
            width: 4px;
        }
        .theory-card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .theory-card-header {
            font-size: 14px;
            font-weight: 700;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theory-topic-block {
            margin-bottom: 8px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .theory-topic-block:last-child {
            border-bottom: none;
        }

        .theory-topic-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theory-topic-desc {
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-left: 18px;
        }

        .theory-topic-desc p {
            margin-top: 4px;
        }

        .theory-formula {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 6px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: #38bdf8;
            margin-top: 6px;
            display: inline-block;
        }

        @media (max-width: 1024px) {
            .theory-grid {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
            .theory-layout {
                height: auto;
            }
        }
    </style>

    <div class="theory-layout">
        <!-- Sidebar chọn các Phần từ 1 đến 7 -->
        <div class="theory-sidebar">
            <div class="theory-sidebar-title">Danh mục tóm tắt</div>
            <button class="theory-menu-btn active" data-part="1" onclick="showTheoryPart(1)">
                <span>🔹</span> Phần 1: Dữ liệu & Toán cơ bản
            </button>
            <button class="theory-menu-btn" data-part="2" onclick="showTheoryPart(2)">
                <span>🟢</span> Phần 2: ML Cổ điển
            </button>
            <button class="theory-menu-btn" data-part="3" onclick="showTheoryPart(3)">
                <span>🟣</span> Phần 3: Mạng Neural & Học sâu
            </button>
            <button class="theory-menu-btn" data-part="4" onclick="showTheoryPart(4)">
                <span>🟠</span> Phần 4: LLM & Tinh chỉnh
            </button>
            <button class="theory-menu-btn" data-part="5" onclick="showTheoryPart(5)">
                <span>🟡</span> Phần 5: Kiến trúc RAG
            </button>
            <button class="theory-menu-btn" data-part="6" onclick="showTheoryPart(6)">
                <span>🟢</span> Phần 6: Agent & MLOps
            </button>
            <button class="theory-menu-btn" data-part="7" onclick="showTheoryPart(7)">
                <span>🌸</span> Phần 7: Vận hành Thực tế
            </button>
        </div>

        <!-- Khung hiển thị nội dung chi tiết -->
        <div class="theory-content">
            <div class="theory-header-block">
                <div class="theory-part-title" id="theory-title">Phần 1: Dữ liệu và Toán học trong AI/ML</div>
                <div style="font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px;">
                    Sổ tay Tóm tắt Lý thuyết & Ví dụ
                </div>
            </div>

            <div class="theory-grid">
                <!-- Cột trái: Trực quan & Trừu tượng (Ví dụ sinh tố) -->
                <div class="theory-card">
                    <div class="theory-card-header" style="color: #38bdf8;">
                        <span>💡</span> Góc nhìn Trực quan & Trừu tượng (Ví dụ thực tế)
                    </div>
                    <div id="theory-metaphor-content">
                        <!-- Sẽ render bằng JS -->
                    </div>
                </div>

                <!-- Cột phải: Thuật ngữ chuyên ngành & Kỹ thuật -->
                <div class="theory-card">
                    <div class="theory-card-header" style="color: #4ade80;">
                        <span>🔬</span> Thuật ngữ & Kiến thức chuyên ngành (Technical Terms)
                    </div>
                    <div id="theory-technical-content">
                        <!-- Sẽ render bằng JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
